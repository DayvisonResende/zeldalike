<style>
  :root {
    color-scheme: light;
    --bg: #dcebc8;
    --bg-dot: #c6dcab;
    --fg: #1f2a1a;
    --muted: #4f6146;
    --title: #ffd23f;
    --title-edge: #1a1c2c;
    --title-shadow: #c8432b;
    --frame: #1a1c2c;
    --frame-hi: #f4f4f4;
    --dialog-bg: #16224a;
    --dialog-edge: #f4f4f4;
    --dialog-fg: #ffffff;
    --dialog-accent: #ffd23f;
    --chip-bg: #1a1c2c;
    --chip-fg: #ffffff;
    --offline: #e43b44;
    --btn-bg: #c8432b;
    --btn-hover: #de5638;
    --btn-fg: #ffffff;
    --btn-shadow: #6e1f14;
    --shadow: rgba(26, 28, 44, .25);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0e1222;
      --bg-dot: #182040;
      --fg: #e7ebf5;
      --muted: #9aa6c2;
      --title-edge: #05060c;
      --title-shadow: #7a2a6e;
      --frame: #05060c;
      --frame-hi: #3a4466;
      --dialog-bg: #0b1433;
      --dialog-edge: #dfe6ff;
      --dialog-fg: #f4f6ff;
      --chip-bg: #1f2a4a;
      --chip-fg: #e7ebf5;
      --offline: #ff5a63;
      --btn-shadow: #4a130c;
      --shadow: rgba(0, 0, 0, .5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0e1222;
    --bg-dot: #182040;
    --fg: #e7ebf5;
    --muted: #9aa6c2;
    --title-edge: #05060c;
    --title-shadow: #7a2a6e;
    --frame: #05060c;
    --frame-hi: #3a4466;
    --dialog-bg: #0b1433;
    --dialog-edge: #dfe6ff;
    --dialog-fg: #f4f6ff;
    --chip-bg: #1f2a4a;
    --chip-fg: #e7ebf5;
    --offline: #ff5a63;
    --btn-shadow: #4a130c;
    --shadow: rgba(0, 0, 0, .5);
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    background-color: var(--bg);
    background-image: radial-gradient(var(--bg-dot) 1.5px, transparent 2px);
    background-size: 16px 16px;
    color: var(--fg);
    font-family: "Press Start 2P", "Courier New", Courier, monospace;
    -webkit-font-smoothing: none;
  }

  .wrap {
    max-width: 800px;
    margin: 0 auto;
    padding: 32px 16px 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    text-align: center;
  }

  .logo {
    display: block;
    width: min(100%, 549px);
    height: auto;
    image-rendering: pixelated;
  }

  h1 {
    margin: 0;
    font-size: clamp(18px, 5.4vw, 40px);
    font-weight: 400;
    line-height: 1.3;
    color: var(--title);
    text-shadow:
      3px 0 0 var(--title-edge), -3px 0 0 var(--title-edge),
      0 3px 0 var(--title-edge), 0 -3px 0 var(--title-edge),
      3px 3px 0 var(--title-edge), -3px -3px 0 var(--title-edge),
      3px -3px 0 var(--title-edge), -3px 3px 0 var(--title-edge),
      7px 7px 0 var(--title-shadow);
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    font-size: 10px;
    background: var(--chip-bg);
    color: var(--chip-fg);
    box-shadow: 0 0 0 3px var(--frame-hi), 0 0 0 6px var(--chip-bg);
  }
  .status .dot {
    width: 8px;
    height: 8px;
    background: var(--offline);
    animation: blink 1s steps(1) infinite;
  }

  .frame {
    width: 100%;
    max-width: 768px;
    margin: 8px 0;
    border: 4px solid var(--frame);
    background: var(--frame);
    box-shadow:
      0 0 0 4px var(--frame-hi),
      0 0 0 8px var(--frame),
      10px 10px 0 8px var(--shadow);
    line-height: 0;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    image-rendering: crisp-edges;
    image-rendering: pixelated;
  }

  .dialog {
    position: relative;
    width: 100%;
    max-width: 768px;
    box-sizing: border-box;
    margin-top: 4px;
    padding: 18px 20px 26px;
    background: var(--dialog-bg);
    color: var(--dialog-fg);
    border: 4px solid var(--dialog-edge);
    box-shadow: 0 0 0 4px var(--dialog-bg), 10px 10px 0 4px var(--shadow);
    text-align: left;
    font-size: clamp(10px, 2.3vw, 13px);
    line-height: 2;
    cursor: pointer;
  }
  .dialog .who {
    margin: 0 0 6px;
    color: var(--dialog-accent);
  }
  .typed { position: relative; margin: 0; }
  .typed .ghost { visibility: hidden; }
  .typed #typed { position: absolute; inset: 0; }
  .arrow {
    position: absolute;
    right: 14px;
    bottom: 6px;
    color: var(--dialog-accent);
    opacity: 0;
  }
  .arrow.show {
    opacity: 1;
    animation: bob .8s steps(2) infinite;
  }

  .btn {
    margin-top: 10px;
    padding: 14px 18px;
    font-family: inherit;
    font-size: 12px;
    color: var(--btn-fg);
    background: var(--btn-bg);
    border: 0;
    box-shadow: inset -4px -4px 0 var(--btn-shadow), 0 0 0 4px var(--frame);
    cursor: pointer;
  }
  .btn:hover { background: var(--btn-hover); }
  .btn:active { transform: translate(2px, 2px); box-shadow: inset 4px 4px 0 var(--btn-shadow), 0 0 0 4px var(--frame); }
  .btn:focus-visible { outline: 3px dashed var(--title); outline-offset: 8px; }

  .foot {
    margin: 0;
    font-size: 10px;
    line-height: 1.8;
    color: var(--muted);
  }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* Celular deitado: cena à esquerda, textos à direita. Tudo cabe na altura da tela, sem rolar:
     a cena deixa pelo menos ~330px para os textos, e letras e botão acompanham a altura (dvh). */
  @media (orientation: landscape) and (max-height: 520px) {
    html, body { height: 100%; overflow: hidden; }
    .wrap {
      max-width: none;
      height: 100vh;
      height: 100dvh;
      box-sizing: border-box;
      padding: 12px 20px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      grid-template-rows: 1fr auto auto auto auto auto 1fr;
      grid-template-areas:
        "frame ."
        "frame name"
        "frame title"
        "frame status"
        "frame dialog"
        "frame btn"
        "frame .";
      column-gap: 24px;
      row-gap: clamp(4px, 1.8dvh, 10px);
      align-items: center;
    }
    .logo { grid-area: name; justify-self: center; width: min(100%, 366px, calc(15dvh * 1098 / 288)); }
    h1 {
      grid-area: title;
      font-size: clamp(12px, 5dvh, 22px);
      text-shadow:
        2px 0 0 var(--title-edge), -2px 0 0 var(--title-edge),
        0 2px 0 var(--title-edge), 0 -2px 0 var(--title-edge),
        2px 2px 0 var(--title-edge), -2px -2px 0 var(--title-edge),
        2px -2px 0 var(--title-edge), -2px 2px 0 var(--title-edge),
        4px 4px 0 var(--title-shadow);
    }
    .status { grid-area: status; justify-self: center; padding: 5px 8px; font-size: clamp(7px, 2dvh, 8px); }
    .frame {
      grid-area: frame;
      align-self: center;
      width: auto;
      margin: 0;
      box-shadow:
        0 0 0 3px var(--frame-hi),
        0 0 0 6px var(--frame),
        6px 6px 0 6px var(--shadow);
    }
    canvas {
      width: min(calc((100vh - 52px) * 256 / 176), calc(100vw - 400px));
      width: min(calc((100dvh - 52px) * 256 / 176), calc(100vw - 400px));
    }
    .dialog {
      grid-area: dialog;
      margin: 4px 0 0;
      padding: 8px 10px 14px;
      font-size: clamp(7px, 2.3dvh, 9px);
      line-height: 1.7;
      box-shadow: 0 0 0 3px var(--dialog-bg), 6px 6px 0 3px var(--shadow);
    }
    .dialog .who { margin-bottom: 2px; }
    .arrow { right: 8px; bottom: 2px; }
    .btn { grid-area: btn; justify-self: center; margin: 4px 0 0; padding: clamp(6px, 2dvh, 10px) 12px; font-size: clamp(8px, 2.6dvh, 10px); }
    .foot { display: none; }
  }

  @keyframes blink { 50% { opacity: 0; } }
  @keyframes bob { 50% { transform: translateY(3px); } }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
</head>

  }

  function path(x, y, rnd, tx, ty) {
    b.fillStyle = '#d8b878';
    b.fillRect(x, y, TS, TS);
    for (let n = 0; n < 6; n++) px(b, x + Math.floor(rnd() * 16), y + Math.floor(rnd() * 16), '#c19c5e');
    for (let n = 0; n < 2; n++) px(b, x + Math.floor(rnd() * 16), y + Math.floor(rnd() * 16), '#ead29c');
    b.fillStyle = '#b38b50';
    const edge = (nx, ny) => inBounds(nx, ny) && tileAt(nx, ny) !== '=';
    if (edge(tx, ty - 1)) b.fillRect(x, y, TS, 1);
    if (edge(tx, ty + 1)) b.fillRect(x, y + 15, TS, 1);
    if (edge(tx - 1, ty)) b.fillRect(x, y, 1, TS);
    if (edge(tx + 1, ty)) b.fillRect(x + 15, y, 1, TS);
  }

  function flowers(x, y, rnd) {
    for (let n = 0; n < 3; n++) {
      const fx = x + 2 + Math.floor(rnd() * 11), fy = y + 2 + Math.floor(rnd() * 11);
      const pet = rnd() < .5 ? '#ffffff' : '#ff8fb1';
      px(b, fx, fy - 1, pet); px(b, fx - 1, fy, pet); px(b, fx + 1, fy, pet); px(b, fx, fy + 1, pet);
      px(b, fx, fy, '#ffd23f');
    }
  }

  for (let ty = 0; ty < MAP.length; ty++) {
    for (let tx = 0; tx < 16; tx++) {
      const ch = MAP[ty][tx], x = tx * TS, y = ty * TS;
      const rnd = mulberry32(ty * 97 + tx * 13 + 7);
      if (ch === '=') path(x, y, rnd, tx, ty);
      else if (ch !== '~') grass(x, y, rnd);
      if (ch === 'T') sprite(b, SPR.tree, x, y);
      if (ch === 'R') sprite(b, SPR.rock, x, y + 3);
      if (ch === 'S') sprite(b, SPR.sign, x, y + 2);
      if (ch === ',') flowers(x, y, rnd);
    }
  }

  // Objetos da cena
  const FIRE = { x: 10 * TS, y: 6 * TS };
  const HERO = { x: 11 * TS, y: 6 * TS };
  sprite(b, SPR.tool, 9 * TS, 4 * TS + 8);
  sprite(b, SPR.logs, FIRE.x, FIRE.y + 11);
  b.fillStyle = 'rgba(0,0,0,.18)';
  b.fillRect(HERO.x + 1, HERO.y + 12, 14, 2);
  sprite(b, SPR.hero, HERO.x, HERO.y + 5);

  // ---------- Camada animada ----------
  const waterTiles = [];
  MAP.forEach((row, ty) => [...row].forEach((ch, tx) => { if (ch === '~') waterTiles.push([tx, ty]); }));

  function drawWater(t) {
    const ph = Math.floor(t / 400);
    for (const [tx, ty] of waterTiles) {
      const x = tx * TS, y = ty * TS;
      ctx.fillStyle = '#3a7fd5';
      ctx.fillRect(x, y, TS, TS);
      ctx.fillStyle = '#8cc4f5';
      for (let k = 0; k < 3; k++) {
        const wy = y + 3 + k * 5;
        const wx = x + ((k * 5 + ph + tx * 3) % 12);
        ctx.fillRect(wx, wy, 2, 1);
        ctx.fillRect(wx + 2, wy - 1, 2, 1);
      }
      ctx.fillStyle = '#d4ecff';
      const isWater = (nx, ny) => !inBounds(nx, ny) || tileAt(nx, ny) === '~';
      for (let i = ph % 2; i < TS; i += 2) {
        if (!isWater(tx, ty - 1)) ctx.fillRect(x + i, y, 1, 1);
        if (!isWater(tx, ty + 1)) ctx.fillRect(x + i, y + 15, 1, 1);
        if (!isWater(tx - 1, ty)) ctx.fillRect(x, y + i, 1, 1);
        if (!isWater(tx + 1, ty)) ctx.fillRect(x + 15, y + i, 1, 1);
      }
    }
  }

  function drawFire(t) {
    const frame = FLAME[Math.floor(t / 140) % FLAME.length];
    sprite(ctx, frame, FIRE.x + 4, FIRE.y + 2);
    const e = Math.floor(t / 90) % 7;
    if (e < 3) px(ctx, FIRE.x + 6 + e, FIRE.y - e, '#ffd23f');
  }

  function drawZzz(t) {
    for (let i = 0; i < 3; i++) {
      const p = ((t / 2200) + i / 3) % 1;
      if (p > .85) continue;
      const zx = Math.round(HERO.x + 4 + p * 10 + Math.sin(p * 7) * 2);
      const zy = Math.round(HERO.y + 4 - p * 26);
      const glyph = p > .35 ? ZBIG : ZSMALL;
      glyph.forEach((row, j) => [...row].forEach((ch, k) => {
        if (ch === '#') {
          px(ctx, zx + k + 1, zy + j + 1, '#1a1c2c');
          px(ctx, zx + k, zy + j, '#ffffff');
        }
      }));
    }
  }

  function drawButterflies(t) {
    const flies = [
      { cx: 60, cy: 50, rx: 34, ry: 14, sp: 2600, col: '#ffffff' },
      { cx: 70, cy: 128, rx: 26, ry: 10, sp: 3100, col: '#ffd23f' }
    ];
    flies.forEach((f, i) => {
      const a = t / f.sp + i * 2;
      const x = Math.round(f.cx + Math.cos(a) * f.rx);
      const y = Math.round(f.cy + Math.sin(a * 2) * f.ry);
      const open = Math.floor(t / 160 + i) % 2 === 0;
      px(ctx, x, y, '#1a1c2c');
      px(ctx, x, y + 1, '#1a1c2c');
      if (open) { px(ctx, x - 1, y, f.col); px(ctx, x + 1, y, f.col); px(ctx, x - 2, y - 1, f.col); px(ctx, x + 2, y - 1, f.col); }
      else { px(ctx, x - 1, y - 1, f.col); px(ctx, x + 1, y - 1, f.col); }
    });
  }

  const shade = document.createElement('canvas');
  shade.width = W; shade.height = H;
  const sh = shade.getContext('2d');
  const glowX = FIRE.x + 8, glowY = FIRE.y + 9;

  function drawNight(t) {
    const r = 48 + Math.sin(t / 120) * 2 + Math.sin(t / 47) * 1.5;
    sh.globalCompositeOperation = 'source-over';
    sh.clearRect(0, 0, W, H);
    sh.fillStyle = 'rgba(10, 16, 48, .64)';
    sh.fillRect(0, 0, W, H);
    sh.globalCompositeOperation = 'destination-out';
    const g = sh.createRadialGradient(glowX, glowY, 4, glowX, glowY, r);
    g.addColorStop(0, 'rgba(0,0,0,1)');
    g.addColorStop(.55, 'rgba(0,0,0,.65)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    sh.fillStyle = g;
    sh.fillRect(0, 0, W, H);
    ctx.drawImage(shade, 0, 0);

    const warm = ctx.createRadialGradient(glowX, glowY, 2, glowX, glowY, r * .8);
    warm.addColorStop(0, 'rgba(255, 150, 50, .22)');
    warm.addColorStop(1, 'rgba(255, 150, 50, 0)');
    ctx.fillStyle = warm;
    ctx.fillRect(0, 0, W, H);
  }

  const fireflies = Array.from({ length: 9 }, (_, i) => {
    const r = mulberry32(400 + i * 31);
    return { bx: 24 + r() * 200, by: 24 + r() * 120, ph: r() * 6.28 };
  });

  function drawFireflies(t) {
    fireflies.forEach((f, i) => {
      if (Math.sin(t / 420 + f.ph * 3) < -0.15) return;
      const x = Math.round(f.bx + Math.sin(t / 1300 + f.ph) * 7);
      const y = Math.round(f.by + Math.cos(t / 1700 + i) * 5);
      ctx.fillStyle = 'rgba(246, 255, 138, .35)';
      ctx.fillRect(x - 1, y, 3, 1);
      ctx.fillRect(x, y - 1, 1, 3);
      px(ctx, x, y, '#f6ff8a');
    });
  }

  const mq = matchMedia('(prefers-color-scheme: dark)');
  const isNight = () => {
    const th = document.documentElement.dataset.theme;
    if (th === 'dark') return true;
    if (th === 'light') return false;
    return mq.matches;
  };

  function render(t) {
    const night = isNight();
    ctx.drawImage(base, 0, 0);
    drawWater(t);
    drawFire(t);
    if (!night) drawButterflies(t);
    if (night) { drawNight(t); drawFireflies(t); }
    drawZzz(t);
  }

  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) {
    render(800);
    mq.addEventListener('change', () => render(800));
  } else {
    const loop = (t) => { render(t); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }

  // ---------- Texto digitado na caixa de diálogo ----------
  const msg = document.getElementById('msg').textContent.trim();
  const ghost = document.getElementById('ghost');
  const out = document.getElementById('typed');
  const arrow = document.getElementById('arrow');
  ghost.textContent = msg;

  let i = 0, timer = null;
  const finish = () => {
    clearTimeout(timer);
    i = msg.length;
    out.textContent = msg;
    arrow.classList.add('show');
  };
  const step = () => {
    i++;
    out.textContent = msg.slice(0, i);
    if (i >= msg.length) return finish();
    const prev = msg[i - 1];
    timer = setTimeout(step, '.,!…'.includes(prev) ? 220 : 38);
  };

  if (reduced) finish();
  else timer = setTimeout(step, 700);
  document.getElementById('dialog').addEventListener('click', finish);

  // ---------- Voltar ao jogo ----------
  // O endereço do jogo vem em ?u= (no app) ou no data-u do quadro (quando o próprio jogo mostra esta tela por cima dele).
  // "Tentar de novo" volta para ele, e a cada 15 s a página confere se o servidor voltou e entra sozinha.
  // Sem endereço, só recarrega.
  const frame = window.frameElement;
  const game = new URLSearchParams(location.search).get('u') || (frame && frame.dataset.u) || null;
  const back = () => { if (!game) location.reload(); else (frame ? window.parent : window).location.href = game; };
  document.getElementById('retry').addEventListener('click', back);
  if (game) setInterval(() => { fetch(game, { mode: 'no-cors', cache: 'no-store' }).then(back, () => {}); }, 15000);
})();
</script>
</body>
</html>
