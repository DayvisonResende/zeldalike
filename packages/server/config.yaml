# ╔══════════════════════════════════════════════════════════════╗
# ║  Mossblade — configuração do servidor                        ║
# ║  Salve o arquivo e o servidor aplica na hora, sem reiniciar. ║
# ║  Se algo estiver errado, ele avisa a linha e mantém o antigo.║
# ╚══════════════════════════════════════════════════════════════╝
# Tempos aceitam 500ms, 30s, 5m, 1h ou um número em segundos.

world:
  maps:                     # id: arquivo do Tiled (caminho relativo a este arquivo). Portais usam o id em "destino".
    vale: ../../content/maps/vale.tmj
    caverna: ../../content/maps/caverna.tmj
  start: vale               # mapa principal: onde se nasce, e onde renasce quem cai em qualquer mapa

server:
  port: 2567
  maxPlayers: 100
  motd: "Bem-vindos ao Vale!"

network:
  sendRate: 20              # atualizações enviadas a cada jogador por segundo

# ── Contas e banco ────────────────────────────────────
database:
  file: data/vale.db        # SQLite; caminho relativo a este arquivo
  backup:                   # cópias automáticas, feitas com o servidor rodando (no chat, /backup faz uma na hora)
    every: 6h               # de quanto em quanto tempo (0 = desligado)
    keep: 28                # quantas guardar (28 a cada 6h = uma semana); as mais velhas são apagadas
    dir: data/backups       # pasta, relativa a este arquivo

# Administradores: usuários (o login da conta, não o nome do personagem) que podem usar os comandos de
# administrador no chat: /anunciar, /expulsar, /silenciar, /invasao, /dar, /backup. Exemplo: [dayvison]
admins: [kaulzz]

accounts:
  maxCharacters: 3          # personagens por conta
  sessionDays: 30           # quanto tempo o login fica lembrado
  saveEvery: 30s            # de quanto em quanto tempo o servidor salva quem está online
  registerPerHour: 20       # contas novas por IP por hora (amigos na mesma casa dividem o IP)
  loginPer5Min: 30          # tentativas de login por IP a cada 5 min, contra quem tenta adivinhar senhas

# ── Chat ──────────────────────────────────────────────
chat:
  maxLength: 120            # caracteres por mensagem
  localRange: 320           # pixels: até onde chega o canal "Perto" (a tela tem 256 de largura)
  burst: 5                  # contra spam: no máximo 5 mensagens...
  per: 5s                   # ...a cada 5 segundos
  announceJoins: true       # avisar quando alguém entra ou sai
  filter: true              # troca palavrões por *** (lista embutida + blockedWords)
  blockedWords: []          # palavras a mais para esconder, por exemplo [palavra1, palavra2]

# ── Regeneração do mundo ──────────────────────────────
regrow:
  bush: 3m                  # arbusto cortado ou levantado volta em 3 minutos
  tallGrass: 1m
  rock: 5m
  secret: 5m                # parede rachada aberta com bomba (ou ilusória revelada pela luz) se fecha de novo
  torch: 90s                # tocha acesa com fogo apaga (e o portão que ela abriu fecha)
  block: 2m                 # bloco empurrado volta ao lugar (quando não tem ninguém perto)

# ── Inimigos ──────────────────────────────────────────
# hp: vida (a espada tira 10: geleca com 20 cai em 2 golpes) · damage: vida que tiram do jogador ao encostar · xp: ganho de quem derruba
# drops: chance de 0 a 1 de cada item (1 unidade), ou { chance, min, max } para sortear a quantidade
enemies:
  slime:
    hp: 20
    respawn: 2m
    damage: 10
    xp: 5
    drops:
      gold: { chance: 0.8, min: 1, max: 3 }
      jelly: 0.5
      heart: 0.2
      mana: 0.1
  beetle:
    hp: 30
    respawn: 4m
    damage: 20
    xp: 12
    drops:
      gold: { chance: 0.9, min: 2, max: 6 }
      shell: 0.4
      heart: 0.25
      mana: 0.15
      bomb: 0.2
  bat:                      # morcego: voa por cima de água e arbustos; no Tiled, "quando: noite" faz ele só aparecer à noite
    hp: 10
    respawn: 1m
    damage: 8
    xp: 4
    drops:
      gold: { chance: 0.6, min: 1, max: 2 }
      mana: 0.15
  chicken:                  # galinha: inofensiva e imortal (a vingança fica em fun)
    hp: 10
    respawn: 1m
    damage: 0
    xp: 0
  king:                     # Rei Geleca, o chefão da caverna (classe king no Tiled)
    hp: 400
    respawn: 15m
    damage: 25              # por onda de choque ao cair de um pulo (e por encostar)
    xp: 250                 # para cada um que bateu nele, não só para quem deu o último golpe
    drops:                  # cada um que bateu ganha o próprio loot
      gold: { chance: 1, min: 30, max: 60 }
      jelly: { chance: 1, min: 3, max: 5 }
      heart: { chance: 1, min: 2, max: 2 }
      bomb: { chance: 0.5, min: 2, max: 4 }
      firestaff: 0.15
      lightstaff: 0.15
      darktome: 0.15

# ── Diversão ──────────────────────────────────────────
fun:
  liftPlayers: true         # E de frente para outro jogador levanta e arremessa (para zueira entre amigos)
  struggle: 10              # teclas que quem está no colo precisa apertar para se soltar
  chickenAnger: 5           # golpes seguidos na mesma galinha até o bando vir se vingar
  swarmSize: 8              # galinhas no bando
  swarmTime: 10s            # quanto tempo o bando persegue
  swarmDamage: 4            # vida por bicada

# ── Magias (cajados e grimório) ───────────────────────
# mana: quanto gasta; damage: vida tirada de um monstro; pvp: vida tirada de um jogador; radius em pixels (16 = um tile)
magic:
  fire:    { mana: 6,  damage: 20, pvp: 12 }                 # Cajado de Fogo: bola de fogo
  blast:   { mana: 15, damage: 30, pvp: 22, radius: 28 }     # ...segurada: explosão
  heal:    { mana: 10, amount: 15, radius: 40 }             # Cajado de Luz: cura quem estiver perto
  bigHeal: { mana: 20, amount: 30, radius: 56 }             # ...segurada: cura maior e empurra monstros
  shadow:  { mana: 8,  damage: 10, pvp: 8,  drain: 5,  slow: 3s }    # Grimório Sombrio: deixa lento e rouba vida
  curse:   { mana: 18, damage: 20, pvp: 14, drain: 10, slow: 6s }    # ...segurada: maldição

# ── Armas ─────────────────────────────────────────────
# Vida que cada golpe tira de um monstro (para jogadores, veja pvp.damage)
weapons:
  sword: 10                 # golpe de espada (e a ponta da espada em riste)
  spin: 20                  # giro carregado
  dash: 20                  # dash com a espada
  arrow: 10                 # flecha
  thrown: 20                # arbusto, pedra, pote ou jogador arremessado
  bomb: 30                  # explosão

# Atributos que cada arma dá enquanto estiver no botão A ou C (somam os dois botões). Todos opcionais:
#   attack: dano a mais na espada (golpe, giro, dash) e na flecha · magic: dano a mais nas magias e cura a mais
#   attackSpeed: % mais rápido para golpear, atirar, conjurar e carregar (até 50) · defense: 100 = metade do dano recebido
#   hp, mp: vida e mana máximas a mais · hpRegen, mpRegen: por segundo, a mais
# Exemplo: firestaff: { magic: 5, mp: 10 }
gear:
  sword: {}
  bow: {}
  firestaff: {}
  lightstaff: {}
  darktome: {}

# ── Lojas ─────────────────────────────────────────────
# O NPC vira lojista com a propriedade "loja" no Tiled (o id daqui). Preços em ouro.
shops:
  clareira:
    buy:                    # o que a loja vende
      heart: 15
      mana: 20
      bomb: 25
      lightstaff: 120       # cajados e grimório: um de cada por pessoa
      firestaff: 120
      darktome: 150
    sell:                   # o que ela compra de você (e quanto paga)
      jelly: 3
      shell: 6
      lambari: 2
      tilapia: 5
      blindfish: 8
      moonfish: 15
      trout: 25
      boot: 1

# ── Eventos do servidor ───────────────────────────────
events:
  invasion:                 # invasão de gelecas: um aviso no chat e depois uma horda marcha até a zona
    every: 40m              # de quanto em quanto tempo (0 = desligada); para testar, ponha 1m
    warning: 30s            # tempo entre o aviso e a chegada da horda
    duration: 3m            # tempo para limpar a horda; acabou, elas recuam
    count: 20               # gelecas na horda
    zone: clareira          # região atacada: durante a invasão monstros entram nela (PvP continua proibido)
    reward:                 # para cada um que derrubou pelo menos uma, se a horda for limpa a tempo
      xp: 40
      gold: 20

# ── Dia e noite ───────────────────────────────────────
daynight:
  cycle: 24m                # duração de um dia inteiro (24m = 1 minuto real por hora do jogo)
  start: 8                  # hora em que o servidor começa (0 a 24)

# ── Jogadores ─────────────────────────────────────────
player:
  maxHp: 100
  maxMana: 50               # ainda sem magias: a barra já existe para magos, curandeiros e bruxos
  hpRegen: 2                # vida por segundo, depois de regenDelay sem levar dano
  manaRegen: 3              # mana por segundo
  regenDelay: 5s
  respawnPoint: clareira    # id da região onde se renasce
  respawnDelay: 5s
  invulnerableAfterRespawn: 3s
  revive: 1.5s              # segurar o botão de Ação ao lado de um amigo caído por esse tempo o levanta (0 = desligado);
                            # enquanto alguém está levantando, a contagem para renascer para

# ── PvP ───────────────────────────────────────────────
pvp:
  mode: optional            # off: ninguém luta · optional: só quem ligou o PvP · open: todos
  toggleCooldown: 5m        # depois de ligar o PvP, só pode desligar após esse tempo
  combatLock: 30s           # depois de uma briga com jogador, não desliga por esse tempo
  safeZones: [clareira]     # regiões sem PvP e sem monstros
  damage:                   # vida que cada golpe tira de outro jogador
    sword: 15
    spin: 25
    dash: 20
    arrow: 10
    thrown: 20
    bomb: 30
  factor: 0.5               # quanto dos atributos vale entre jogadores: 0,5 = metade do ataque, do poder mágico e da defesa
  announceKills: true       # "Fulano derrubou Beltrano" no chat de todos

party:
  maxSize: 4                # jogadores por grupo
  xpRange: 320              # pixels: XP de monstro dividido igualmente com quem do grupo estiver até aqui (a tela tem 256)

# ── Progressão e itens ────────────────────────────────
rates:
  xp: 1.0                   # 2.0 = XP em dobro
  drop: 1.0                 # multiplica a chance de todos os drops
  gold: 1.0                 # multiplica o ouro que cai

leveling:
  maxLevel: 50
  base: 50                  # XP para o próximo nível = base × nível^exponent (50, 141, 260, 400, 559…)
  exponent: 1.5
  hpPerLevel: 2             # vida máxima a mais por nível (pouco de propósito: quem deixa o personagem forte é o item)
  manaPerLevel: 1           # no nível 50: 198 de vida e 99 de mana (2× o início)

inventory:
  slots: 20
  stack: 99                 # itens iguais por espaço

loot:
  ownerTime: 10s            # só quem derrubou pega, até esse tempo
  lifetime: 1m              # depois disso o drop some do chão
